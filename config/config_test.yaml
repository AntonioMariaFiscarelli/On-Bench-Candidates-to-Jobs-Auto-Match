artifacts_root: artifacts_b

candidate_log_table: MPG_IT_ONBENCH_CANDIDATE_LOG
vacancy_log_table: MPG_IT_ONBENCH_JOBORDER_LOG

data_ingestion:  
  root_dir: artifacts_b/data_ingestion
  database: IT_DISCOVERY
  schema: CONSUMER_INT_MODEL
  candidate_tables:
    input_table: CANDIDATE_CLEANED
    input_table_pb: PB_FTCANDIDATE_CLEANED
    output_table: MPG_IT_ONBENCH_TEST_CANDIDATE
    output_table_cleaned: MPG_IT_ONBENCH_TEST_CANDIDATE_CLEANED
  vacancy_tables:
    input_table: JOBORDER_CLEANED
    input_table_pb: PB_FTJOBORDER_CLEANED
    output_table: MPG_IT_ONBENCH_TEST_JOBORDER
    output_table_cleaned: MPG_IT_ONBENCH_TEST_JOBORDER_CLEANED
  italian_cities:
    input_file: italian_cities/italian_cities.xlsx
    output_table: MPG_IT_ONBENCH_ITALIAN_CITIES_TEST

data_transformation:  
  root_dir: artifacts_b/data_transformation
  database: IT_DISCOVERY
  schema: CONSUMER_INT_MODEL
  candidate_tables:
    input_table: MPG_IT_ONBENCH_TEST_CANDIDATE
    input_table_cleaned: MPG_IT_ONBENCH_TEST_CANDIDATE_CLEANED
    output_table_cleaned: MPG_IT_ONBENCH_TEST_CANDIDATE_FEATURES_CLEANED
    output_table: MPG_IT_ONBENCH_TEST_CANDIDATE_FEATURES
  vacancy_tables:
    input_table: MPG_IT_ONBENCH_TEST_JOBORDER
    input_table_cleaned: MPG_IT_ONBENCH_TEST_JOBORDER_CLEANED
    output_table_cleaned: MPG_IT_ONBENCH_TEST_JOBORDER_CLEANED_FEATURES
    output_table: MPG_IT_ONBENCH_TEST_JOBORDER_FEATURES
  input_table_italian_cities: MPG_IT_ONBENCH_ITALIAN_CITIES_TEST

deployment:
  root_dir: artifacts_b/data_transformation
  database: IT_DISCOVERY
  schema: CONSUMER_INT_MODEL
  warehouse: IT_NONPROD_CTDM_COMPUTE_WH
  config_dir: config
  stage_sp: MPG_IT_ONBENCH_STAGE_SP
  data_ingestion_sp: DataIngestionSP
  data_transformation_sp: DataTransformationSP
  data_ingestion_task: DataIngestionTask
  data_transformation_task: DataTransformationTask

vacancy_search_table: &vac_t_search MPG_IT_ONBENCH_VACANCY_APP_TEMP

ONBENCH:
  root_dir: artifacts_b/llm
  database: IT_DISCOVERY
  schema: CONSUMER_INT_MODEL
  input_table: MPG_IT_ONBENCH_TEST_CANDIDATE_FEATURES
  vacancy_search_table: *vac_t_search

app:
  root_dir: artifacts_b/app
  database: IT_DISCOVERY
  schema: CONSUMER_INT_MODEL
  vacancy_table: MPG_IT_ONBENCH_TEST_JOBORDER_FEATURES
  vacancy_search_table: *vac_t_search


